<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Erro na Verificação</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0f;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .card {
    width:100%; max-width:420px;
    background:#0d0d14; border:1px solid #2a1a24;
    border-radius:24px; padding:40px 24px 28px;
    text-align:center; animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .icon-wrap { position:relative; width:96px; height:96px; margin: 0 auto 22px; }
  .icon-bg {
    width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle, rgba(237,66,69,0.2), rgba(237,66,69,0.02));
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(237,66,69,0.35);
    box-shadow: 0 0 40px rgba(237,66,69,0.35);
  }
  .icon-x { font-size:44px; color:#ed4245; font-weight:700; line-height:1; }
  h1 { font-size:22px; font-weight:800; margin-bottom:10px; letter-spacing:-0.3px; }
  .subtitle { color:#8a8a9a; font-size:14px; line-height:1.5; margin-bottom:20px; }
  .motivo {
    background: rgba(237,66,69,0.08); border:1px solid rgba(237,66,69,0.25);
    border-radius:12px; padding:14px 16px; margin-bottom:22px;
    color:#ffb3b4; font-size:13px; line-height:1.5; text-align:left;
  }
  .motivo::before { content:"⚠️ "; margin-right:4px; }
  .btn {
    width:100%; padding:15px; border-radius:12px;
    font-family:inherit; font-size:15px; font-weight:600;
    cursor:pointer; border:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; transition: transform 0.15s ease;
    background: linear-gradient(135deg,#5865F2,#6b46e8);
    color:#fff; box-shadow: 0 6px 20px rgba(88,101,242,0.35);
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { background: linear-gradient(135deg,#6577ff,#7a52f5); }
  .credits { text-align:center; color:#3a3a4a; font-size:12px; margin-top:20px; letter-spacing:0.2px; }
  .credits a { color:#5865F2; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-bg"><div class="icon-x">✕</div></div>
    </div>
    <h1>Algo deu errado</h1>
    <p class="subtitle">Não foi possível concluir a verificação.</p>
    <div class="motivo">{{ motivo }}</div>
    <a class="btn" href="/">🔄 Tentar novamente</a>
  </div>
  <p class="credits">Desenvolvido por <a href="#">{{ app_name }}</a></p>
</body>
</html>
